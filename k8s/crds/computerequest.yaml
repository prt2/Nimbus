apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: computerequests.nimbus.io
spec:
  group: nimbus.io
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["tenantId", "image", "cpu", "memory"]
              properties:
                tenantId:
                  type: string
                image:
                  type: string
                cpu:
                  type: string
                memory:
                  type: string
                replicas:
                  type: integer
                  default: 1
            status:
              type: object
              properties:
                phase:
                  type: string
                deploymentName:
                  type: string
                message:
                  type: string
  scope: Namespaced
  names:
    plural: computerequests
    singular: computerequest
    kind: ComputeRequest
    shortNames:
      - cr
