# Store a Grafana dashboard as JSON inside a ConfigMap.
# The grafana_dashboard label lets a configured Grafana sidecar discover it.
# Panels query Nimbus request, usage, billing, and autoscaling metrics from Prometheus.

apiVersion: v1
kind: ConfigMap
metadata:
  name: nimbus-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  nimbus.json: |
    {
      "title": "Nimbus Cloud Control Plane",
      "uid": "nimbus-main",
      "panels": [
        {
          "id": 1,
          "title": "API Request Rate",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "rate(nimbus_api_requests_total[5m])", "legendFormat": "{{method}} {{path}} {{status}}"}]
        },
        {
          "id": 2,
          "title": "API Latency p99",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "histogram_quantile(0.99, rate(nimbus_api_request_duration_seconds_bucket[5m]))", "legendFormat": "p99 {{path}}"}]
        },
        {
          "id": 3,
          "title": "Pods Running per Tenant",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{"expr": "nimbus_tenant_pods_running", "legendFormat": "{{tenant}}"}]
        },
        {
          "id": 4,
          "title": "CPU Usage per Tenant (millicores)",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{"expr": "nimbus_tenant_cpu_millicores", "legendFormat": "{{tenant}}"}]
        },
        {
          "id": 5,
          "title": "Billing CPU Seconds",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [{"expr": "rate(nimbus_billing_cpu_seconds_total[5m])", "legendFormat": "{{tenant}}"}]
        },
        {
          "id": 6,
          "title": "Autoscaler Actions",
          "type": "graph",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "targets": [{"expr": "rate(nimbus_autoscaler_actions_total[5m])", "legendFormat": "{{namespace}} {{direction}}"}]
        }
      ],
      "schemaVersion": 27,
      "version": 1
    }
