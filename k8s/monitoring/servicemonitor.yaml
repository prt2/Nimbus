# Describe a service pointing at the host API and a Prometheus monitor for /metrics.
# The monitor selects a service by label and refers to its port by name (http).

apiVersion: v1
kind: Service
metadata:
  name: nimbus-api-external
  namespace: monitoring
  labels:
    app: nimbus-api
spec:
  type: ExternalName
  externalName: host.docker.internal
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nimbus-api
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: nimbus-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
