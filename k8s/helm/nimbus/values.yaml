# Settings read by the Helm templates; override them when installing or upgrading Nimbus.

# Default values for Nimbus
replicaCount: 1

image:
  repository: prt2/nimbus
  pullPolicy: IfNotPresent
  tag: "latest"

api:
  port: 8080
  jwtSecret: "nimbus-super-secret-key-change-in-production"

database:
  host: postgres
  port: 5432
  name: nimbus
  user: nimbus
  password: nimbus123

# Requests reserve resources for the API pod; limits cap how much it can use.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 8080

# Reserved ingress settings; this chart currently has no ingress template.
ingress:
  enabled: false
  host: nimbus.local
